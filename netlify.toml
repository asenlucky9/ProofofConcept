[build]
  base = "assignment-tracker"
  command = "cd assignment-tracker && npm install && npm run build"
  publish = "assignment-tracker/dist"

[build.environment]
  NODE_VERSION = "18.17.0"
  NPM_VERSION = "9.6.7"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "true"
  NODE_ENV = "production"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 